[project]
name = "shadowtrack"
version = "0.1.0"
description = "Highlight shadows in images and videos with OpenCV"
authors = [
    { name = "David Korčák", email = "korcadav@fel.cvut.cz" }
]
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
]

[project.scripts]
shadow-highlight = "shadowtrack.shadow_highlight:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
